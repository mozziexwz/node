name: msboost
services:
  server:
    image: ${MSBOOST_IMAGE:-ghcr.io/mozziexwz/node:v0.2.2}
    restart: unless-stopped
    env_file: ${MSBOOST_ENV_FILE:-../.env}
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /app/data
      TRUSTED_PROXY_CIDRS: 172.30.86.2/32
      DATABASE_HOST: database
      DATABASE_USER: msboost
      DATABASE_NAME: ${MSBOOST_DATABASE_NAME:-msboost}
      DATABASE_SSLMODE: disable
    volumes:
      - app_data:/app/data
    depends_on:
      database:
        condition: service_healthy
    networks: [control]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  database:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: msboost
      POSTGRES_USER: msboost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U msboost -d msboost]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [control]
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      MSBOOST_DOMAIN: ${MSBOOST_DOMAIN:?Set MSBOOST_DOMAIN}
      MSBOOST_SITE_ADDRESS: ${MSBOOST_SITE_ADDRESS:?Set MSBOOST_SITE_ADDRESS}
    ports: [80:80,443:443]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      control:
        ipv4_address: 172.30.86.2
networks:
  control:
    ipam:
      config:
        - subnet: 172.30.86.0/24
          ip_range: 172.30.86.128/25
          gateway: 172.30.86.1
volumes:
  app_data:
    name: msboost_app_data
  database_data:
    name: msboost_database_data
  caddy_data:
    name: msboost_caddy_data
  caddy_config:
    name: msboost_caddy_config
