name: msboost
services:
  server:
    image: ${MSBOOST_IMAGE:-ghcr.io/mozziexwz/node:v2.3.3}
    restart: unless-stopped
    env_file: ${MSBOOST_ENV_FILE:-../.env}
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /app/data
      TRUSTED_PROXY_CIDRS: 172.30.86.1/32
      DATABASE_HOST: database
      DATABASE_USER: msboost
      DATABASE_NAME: ${MSBOOST_DATABASE_NAME:-msboost}
      DATABASE_SSLMODE: disable
    volumes:
      - app_data:/app/data
      - ../status:/app/disaster-status:ro
    depends_on:
      database:
        condition: service_healthy
    networks: [control]
    ports: [127.0.0.1:18080:8080]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  database:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: msboost
      POSTGRES_USER: msboost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U msboost -d msboost]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [control]
networks:
  control:
    ipam:
      config:
        - subnet: 172.30.86.0/24
          ip_range: 172.30.86.128/25
          gateway: 172.30.86.1
volumes:
  app_data:
    name: msboost_app_data
  database_data:
    name: msboost_database_data
