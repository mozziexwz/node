name: Bootstrap v0.3.3 release tag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-v0.3.3.yml']
permissions:
  contents: write
  actions: write
concurrency: msboost-v0.3.3-bootstrap
jobs:
  tag-and-dispatch:
    if: github.repository == 'mozziexwz/node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact release source
        run: |
          set -Eeuo pipefail
          bash deploy/version_test.sh v0.3.3
          test -z "$(git status --porcelain)"
      - name: Create the immutable tag and dispatch its full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # A create-only request fails if the tag already exists; never move it.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.3.3 -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run ci.yml --ref v0.3.3
