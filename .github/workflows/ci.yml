name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: msboost_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msboost_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag before publishing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bash deploy/version_test.sh "$VERSION"
      - name: Verify platform detection on real Debian 12 and 13 without deploying
        run: |
          for version in 12 13; do
            docker pull "debian:$version"
            docker run --rm --network none --mount "type=bind,source=$PWD,target=/src,readonly" "debian:$version" bash /src/deploy/platform_test.sh
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify whole-site disaster backup and clean-host restore with real Docker
        env:
          MSBOOST_CI_DISASTER: '1'
        run: sudo env GITHUB_ACTIONS=true MSBOOST_CI_DISASTER=1 PATH="$PATH" bash deploy/disaster_integration_test.sh
      - run: go test -race -count=1 ./...
        env:
          MSBOOST_TEST_POSTGRES_URL: postgres://msboost_ci:isolated-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      - name: Verify isolated Linux cleanup and real PostgreSQL disaster import
        env:
          MSBOOST_TEST_POSTGRES_URL: postgres://msboost_ci:isolated-ci-only@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go test -race -count=1 -v ./internal/executor -run '^TestCleanupPython(IsolatedInventoryAndMutation|MSBOOSTOwnershipAndRetainedData)$'
          go test -race -count=1 -v ./internal/control -run '^TestOfflineRestorePostgresIntegration$'
      - run: go vet ./...
      - name: Verify Cloudflare trusted proxy boundaries with real Caddy
        run: |
          mkdir -p .runtime/caddy
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz -o .runtime/caddy/archive.tar.gz
          printf '%s\n' '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  .runtime/caddy/archive.tar.gz' | sha512sum --check --strict
          tar -xzf .runtime/caddy/archive.tar.gz -C .runtime/caddy caddy
          CADDY_TEST_BINARY="$PWD/.runtime/caddy/caddy" go test -race ./deploy -count=1 -v
      - run: npm ci && npm run build
        working-directory: apps/web
      - name: Verify real HTTP workflows against isolated server
        shell: bash
        run: |
          mkdir -p .runtime
          go build -o .runtime/msboost-server ./cmd/server
          node scripts/test-http.mjs
      - name: Install isolated test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows and supplementary UI
        run: node scripts/test-http.mjs --browser
      - name: Verify pinned GOST two-hop forwarding
        shell: bash
        run: |
          mkdir -p .runtime/gost
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/go-gost/gost/releases/download/v3.3.0/gost_3.3.0_linux_amd64.tar.gz -o .runtime/gost/archive.tar.gz
          printf '%s\n' '676fb7f78d267b6ae73df719c0c7f2b565dde7147da935cfafbc1e1da558b6d5  .runtime/gost/archive.tar.gz' | sha256sum --check --strict
          tar -xzf .runtime/gost/archive.tar.gz -C .runtime/gost gost
          GOST_TEST_BINARY="$PWD/.runtime/gost/gost" go test -race ./internal/relayruntime -run TestRealGost -count=1 -v
          GOST_TEST_BINARY="$PWD/.runtime/gost/gost" go test -race ./internal/executor -run TestRealGostCredentialConfigFileName -count=1 -v
      - name: Verify lease expiry and protected recovery with existing GOST connections
        shell: bash
        env:
          MSBOOST_TEST_POSTGRES_URL: postgres://msboost_ci:isolated-ci-only@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go test -c -race -o .runtime/relay-lease.test ./internal/relayruntime
          go test -c -race -o .runtime/control-outage.test ./internal/control
          sudo unshare --net -- bash -c '
            set -Eeuo pipefail
            ip link set lo up
            "$2" -test.run "^TestV2(RecoveryLinux|StateDirectoryLock)" -test.count=1 -test.v -test.timeout=3m
            env MSBOOST_TEST_LOOPBACK_NETNS=1 MSBOOST_REAL_GOST_RECOVERY=1 GOST_TEST_BINARY="$1" "$2" -test.run "^TestRealGost(LeaseExpiryClosesExistingConnection|ProtectedRecoveryKeepsOriginalConnection|KeepLastNewConnectionsAndRuleIsolation)$" -test.count=1 -test.v -test.timeout=4m
            env MSBOOST_TEST_LOOPBACK_NETNS=1 MSBOOST_REAL_GOST_TLS_TIME=1 GOST_TEST_BINARY="$1" "$2" -test.run "^TestRealGostTLSCertificateTimeBoundaries$" -test.count=1 -test.v -test.timeout=2m
            "$3" -test.run "^TestBackupActivityLockLinux" -test.count=1 -test.v -test.timeout=2m
            env MSBOOST_TEST_LOOPBACK_NETNS=1 MSBOOST_REAL_CONTROL_OUTAGE=1 GOST_TEST_BINARY="$1" "$3" -test.run "^TestRealControlBackupPauseAndOfflineConnection$" -test.count=1 -test.v -test.timeout=8m
            env MSBOOST_TEST_LOOPBACK_NETNS=1 MSBOOST_REAL_CONTROL_REVOKE=1 GOST_TEST_BINARY="$1" "$3" -test.run "^TestRealControlMemberRevokeWithLostStopACK$" -test.count=1 -test.v -test.timeout=4m
          ' msboost-isolated-test "$PWD/.runtime/gost/gost" "$PWD/.runtime/relay-lease.test" "$PWD/.runtime/control-outage.test"
          # The disk fault is a separate private mount namespace and a bounded
          # 1MiB tmpfs; never fill or remount the runner's own filesystem.
          sudo unshare --mount --net --propagation private -- bash -c '
            set -Eeuo pipefail
            ip link set lo up
            env MSBOOST_TEST_LOOPBACK_NETNS=1 MSBOOST_TEST_PRIVATE_MOUNT_NS=1 MSBOOST_REAL_GOST_DISK_FAILURE=1 GOST_TEST_BINARY="$1" "$2" -test.run "^TestRealGostPrivateDiskFullKeepsOriginalConnection$" -test.count=1 -test.v -test.timeout=2m
          ' msboost-private-disk "$PWD/.runtime/gost/gost" "$PWD/.runtime/relay-lease.test"
          # The actual local maintenance entries require root, while their
          # disposable PostgreSQL service is reachable only outside the above
          # loopback-only namespace. Each test creates its own guarded database.
          sudo env MSBOOST_TEST_POSTGRES_URL="$MSBOOST_TEST_POSTGRES_URL" "$PWD/.runtime/control-outage.test" -test.run '^Test(AdminPasswordPostgresIntegration|RelayRecoveryPostgresConcurrentPrepare)$' -test.count=1 -test.v -test.timeout=3m
      - name: Check installers without executing them
        run: |
          for script in install.sh agent.sh deploy/*.sh installers/node/msboost.sh installers/reinstall/reinstall.sh; do bash -n "$script"; done
          bash deploy/manage.sh --help
          bash install.sh --help
          bash agent.sh --help
          bash deploy/manage_test.sh
          bash deploy/bootstrap_test.sh
          bash deploy/disaster_test.sh
          bash deploy/disaster_joint_validation_test.sh
          bash deploy/relay_dynamic_user_validation_test.sh
          bash deploy/agent_bootstrap_test.sh
          go test -race -tags msboost_joint_test ./internal/control -run '^TestDisasterJointSFTPObservation$' -count=1
      - run: go build ./cmd/server && go build ./cmd/agent && go build ./cmd/restore
  relay-endurance:
    name: Real GOST keep_last (${{ matrix.duration }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        duration: [5m, 30m]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build production runtime tests with Linux race instrumentation
        run: |
          mkdir -p .runtime/relay-endurance
          go test -c -race -o .runtime/relay-endurance/relay.test ./internal/relayruntime
      - name: Verify pinned official GOST executable
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/go-gost/gost/releases/download/v3.3.0/gost_3.3.0_linux_amd64.tar.gz -o .runtime/relay-endurance/gost.tar.gz
          printf '%s\n' '676fb7f78d267b6ae73df719c0c7f2b565dde7147da935cfafbc1e1da558b6d5  .runtime/relay-endurance/gost.tar.gz' | sha256sum --check --strict
          tar -xzf .runtime/relay-endurance/gost.tar.gz -C .runtime/relay-endurance gost
      - name: Real persistent TCP and TLS connections through independent agents
        env:
          DURATION: ${{ matrix.duration }}
        run: |
          set -Eeuo pipefail
          sudo bash deploy/relay_endurance_test.sh "$PWD/.runtime/relay-endurance/relay.test" "$PWD/.runtime/relay-endurance/gost" "$DURATION" 2>&1 | tee .runtime/relay-endurance/results.log
          test "$(grep -c 'REAL_GOST_KEEP_LAST_PASS ' .runtime/relay-endurance/results.log)" = 3
          grep -qx 'PASS' .runtime/relay-endurance/results.log
      - name: Retain credential-free real test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-endurance-${{ matrix.duration }}
          path: .runtime/relay-endurance/results.log
          if-no-files-found: ignore
          retention-days: 14
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify, relay-endurance]
    env:
      MSBOOST_ENV_FILE: /tmp/msboost-ci.env
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image and Compose configuration
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export MSBOOST_IMAGE="ghcr.io/${REPOSITORY}:${VERSION}"
          export ADMIN_EMAIL=12345678@qq.com ADMIN_PASSWORD="$(openssl rand -hex 24 | sed -E 's/(.{5})/\1-/g')"
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export MSBOOST_DOMAIN=localhost MSBOOST_SITE_ADDRESS=http://localhost PUBLIC_URL=http://localhost COOKIE_SECURE=false
          umask 077
          printf '%s\n' "ADMIN_EMAIL=$ADMIN_EMAIL" "ADMIN_PASSWORD=$ADMIN_PASSWORD" "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" "PUBLIC_URL=$PUBLIC_URL" "COOKIE_SECURE=$COOKIE_SECURE" > "$MSBOOST_ENV_FILE"
          docker compose --project-name msboost --file deploy/compose.yml config --quiet
          docker compose --project-name msboost --file deploy/compose.yml up --detach --wait --wait-timeout 180
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 --resolve localhost:80:127.0.0.1 http://localhost/api/health | jq --exit-status --arg version "$VERSION" '.status == "ok" and .version == $version'
          docker compose --project-name msboost --file deploy/compose.yml logs --tail 30
      - name: Export prebuilt image fallback for anonymous Release downloads
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .runtime/images
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --build-arg "VERSION=$VERSION" --tag "ghcr.io/$REPOSITORY:$VERSION" --output "type=docker,dest=.runtime/images/msboost-image-linux-$arch.tar" .
            gzip -n ".runtime/images/msboost-image-linux-$arch.tar"
            docker load --input ".runtime/images/msboost-image-linux-$arch.tar.gz"
            test "$(docker image inspect "ghcr.io/$REPOSITORY:$VERSION" --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            test "$(docker image inspect "ghcr.io/$REPOSITORY:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/$REPOSITORY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-images
          path: .runtime/images/*.tar.gz
          retention-days: 3
          compression-level: 0
      - name: Clean isolated CI containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-cleanup-placeholder
          ADMIN_EMAIL: 12345678@qq.com
          ADMIN_PASSWORD: ci-cleanup-placeholder
          MSBOOST_DOMAIN: localhost
          MSBOOST_SITE_ADDRESS: http://localhost
          PUBLIC_URL: http://localhost
        run: |
          if [ -f "$MSBOOST_ENV_FILE" ]; then
            docker compose --project-name msboost --file deploy/compose.yml logs --tail 100 || true
            docker network inspect msboost_control --format '{{json .IPAM.Config}} {{json .Containers}}' || true
            docker compose --project-name msboost --file deploy/compose.yml down --volumes
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-images
          path: .runtime/release
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build verified deployment bundle and standalone agents
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/package-release.sh "$VERSION"
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" .runtime/release/* --verify-tag --title "MSBOOST $VERSION" --notes-file docs/release-notes.md
